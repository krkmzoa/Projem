<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menü Ekranı</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* TV ekranı. Eski akıllı TV tarayıcılarında da çalışsın diye:
     CSS değişkeni, vh/vw, flex ve CSS sütunları KULLANILMADI.
     1rem = ekran yüksekliğinin %1'i (JS ayarlar). Renkler JS ile #theme stiline yazılır. */
  html { font-size: 10.8px; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14100d; color: #f5ede4; cursor: none; }
  body { font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif; font-size: 2.05rem; }
  .serif { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; }

  #top { position: absolute; top: 3.2rem; left: 3.4%; right: 3.4%; height: 9rem; border-bottom: 2px solid #3a2f27; }
  #brand { float: left; }
  #brand img { float: left; height: 7rem; width: 7rem; border-radius: 50%; margin-right: 1.6rem; }
  #brand h1 { margin: 0; font-size: 5rem; font-weight: 600; line-height: 1.05; }
  #brand p { margin: .4rem 0 0; font-size: 2.1rem; }
  #clock { float: right; font-size: 4.2rem; font-weight: 500; line-height: 7rem; }

  #stage { position: absolute; top: 14.6rem; bottom: 16.2rem; left: 3.4%; right: 3.4%; }
  .page { position: absolute; top: 0; left: 0; right: 0; bottom: 0; visibility: hidden; opacity: 0; -webkit-transition: opacity .8s; transition: opacity .8s; }
  .page.show { visibility: visible; opacity: 1; }
  .col { position: absolute; top: 0; overflow: hidden; }
  #measure { position: absolute; left: -9999px; top: 0; visibility: hidden; }

  /* Menü yazıları em ile: #stage yazı boyutu (paneldeki "TV yazı boyutu") hepsini birlikte büyütür. */
  #stage { font-size: 1rem; }
  .cat { margin: 0 0 .364em; padding-top: .424em; font-size: 3.3em; font-weight: 600; }
  .cat.first { padding-top: 0; }
  .cat small { font-size: .545em; font-weight: 400; font-family: 'Inter', Arial, sans-serif; }
  .it { padding: .7em 0 1em; }
  .row { overflow: hidden; }
  .pr { float: right; font-size: 2.5em; font-weight: 600; white-space: nowrap; margin-left: .6em; }
  .pr span { margin-left: .56em; }
  .pr span.f { margin-left: 0; }
  .pr small { font-weight: 500; font-size: .72em; margin-right: .22em; }
  .nm { font-size: 2.5em; font-weight: 600; }
  .ds { font-size: 1.85em; margin-top: .108em; }
  .tg { display: inline-block; font-size: 1.4em; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: .107em .43em; border-radius: .36em; margin-left: .57em; vertical-align: middle; position: relative; top: -.14em; }
  .out .nm, .out .pr { text-decoration: line-through; }
  .tg.o { background: #8c2a22; color: #fff; }

  #bottom { position: absolute; bottom: 2.6rem; left: 3.4%; right: 3.4%; height: 11.8rem; border-top: 2px solid #3a2f27; }
  #qr { float: left; margin-top: 1.6rem; }
  #qr .code { float: left; width: 10rem; height: 10rem; background: #fff; border-radius: .8rem; overflow: hidden; margin-right: 1.6rem; }
  #qr .code img { width: 10rem; height: 10rem; display: block; }
  #qr .txt { float: left; padding-top: 2.4rem; font-size: 2rem; }
  #qr b { display: block; font-size: 2.3rem; }
  #info { float: right; margin-top: 4.8rem; font-size: 2rem; }
  #info span { margin-left: 3rem; }
  #dots { position: absolute; left: 0; right: 0; top: 5.6rem; text-align: center; }
  #dots span { display: inline-block; width: 1.1rem; height: 1.1rem; border-radius: 50%; margin: 0 .4rem; }
  .msg { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-size: 3rem; }
  /* Tam ekran tanıtım resimleri (panelden yüklenir) */
  #slide { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; background-color: #000; background-repeat: no-repeat; background-position: center center; -webkit-background-size: cover; background-size: cover; visibility: hidden; opacity: 0; -webkit-transition: opacity .8s; transition: opacity .8s; }
  #slide.contain { -webkit-background-size: contain; background-size: contain; }
  #slide.show { visibility: visible; opacity: 1; }
  #err { position: absolute; left: 1rem; bottom: .4rem; font-size: 1.4rem; color: #ff8a80; }
</style>
<style id="theme"></style>
</head>
<body>
<div id="top"><div id="brand"></div><div id="clock"></div></div>
<div id="stage"><div class="msg">Menü yükleniyor…</div></div>
<div id="bottom"><div id="qr"></div><div id="dots"></div><div id="info"></div></div>
<div id="slide"></div>
<div id="err"></div>

<script>
  // Hata olursa ekranın köşesine yaz (sorun tespiti için).
  window.onerror = function (msg, src, line) {
    var e = document.getElementById('err');
    if (e) e.innerHTML = 'Hata: ' + String(msg).replace(/</g, '&lt;') + ' (satır ' + line + ')';
  };
</script>
<script src="assets/vendor/qrcode.js?v=10"></script>
<script>
/* Otomatik güncelleme: site yenilenince (version.json) eski hafızadaki sayfa kendini yeniler.
   Ana ekran uygulaması, tablet ve TV için. Eski tarayıcılarla uyumlu yazıldı. */
(function () {
  var BUILD = 10;
  function check() {
    if (window.qrBusy && window.qrBusy()) return;
    var x = new XMLHttpRequest();
    x.open('GET', 'version.json?t=' + new Date().getTime(), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4 || x.status !== 200) return;
      var v; try { v = JSON.parse(x.responseText).v; } catch (e) { return; }
      if (!(v > BUILD)) return;
      if (location.search.indexOf('_v=' + v) !== -1) return; // döngüye girme
      var parts = location.search.replace(/^\?/, '').split('&'), q = [];
      for (var i = 0; i < parts.length; i++) if (parts[i] && parts[i].indexOf('_v=') !== 0) q.push(parts[i]);
      q.push('_v=' + v);
      location.replace(location.pathname + '?' + q.join('&') + location.hash);
    };
    x.send();
  }
  check();
  setInterval(check, 5 * 60 * 1000);
  if (document.addEventListener) document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
})();
</script>
<script src="assets/core.js?v=10"></script>
<script>
(function () {
  var C = window.MenuCore, esc = C.esc;
  var menu = null, lastJson = '', pages = [], pageIdx = 0, timer = null, slideIdx = 0, slideInfo = {};
  var stage = document.getElementById('stage');

  function param(name) {
    var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  // Eski TV tarayıcılarında emoji yazı tipi yok (kutucuk görünür); simgeler ancak ?ikon=1 ile gösterilir.
  var showIcons = param('ikon') === '1';

  function $(id) { return document.getElementById(id); }

  // 1rem = ekran yüksekliğinin %1'i
  function scale() {
    var h = window.innerHeight || document.documentElement.clientHeight || 1080;
    document.documentElement.style.fontSize = (h / 100) + 'px';
  }
  scale();

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() { var d = new Date(); $('clock').innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  tick(); setInterval(tick, 10000);

  // ---------- renkler (CSS değişkeni yerine düz CSS üretilir) ----------
  function applyColors() {
    var t = menu.theme, P = C.PALETTES, p = P.tv;
    if (t.tvMode === 'same') p = t.mode === 'custom' ? t.colors : (t.mode === 'light' ? P.light : P.tv);
    var a = /^#[0-9a-fA-F]{6}$/.test(t.accent) ? t.accent : '#b5651d';
    var on = C.onAccent(a), line = C.mix(p.bg, p.text, 0.16);
    var css =
      'html,body{background:' + p.bg + ';color:' + p.text + '}' +
      '#top,#bottom{border-color:' + line + '}' +
      '#brand p,#clock,.ds,.cat small,.pr small,#qr .txt,#info,.out .nm,.out .pr,.msg{color:' + p.muted + '}' +
      '#qr b,#info b{color:' + p.text + '}' +
      '.cat{color:' + a + '}' +
      '.tg{background:' + a + ';color:' + on + '}.tg.o{background:#8c2a22;color:#fff}' +
      '#dots span{background:' + line + '}#dots span.on{background:' + a + '}';
    var st = $('theme');
    if (st.styleSheet) st.styleSheet.cssText = css; else st.innerHTML = css;
  }

  // ---------- menü öğeleri ----------
  function itemEl(it) {
    var cur = menu.cafe.currency, ps = C.prices(it), prices = '';
    for (var i = 0; i < ps.length; i++) {
      prices += '<span' + (i === 0 ? ' class="f"' : '') + '>' + (ps[i].name ? '<small>' + esc(ps[i].name) + '</small>' : '') + esc(C.price(ps[i].price, cur)) + '</span>';
    }
    var tags = '';
    for (var j = 0; j < it.tags.length; j++) tags += '<span class="tg">' + esc(it.tags[j]) + '</span>';
    if (!it.available) tags += '<span class="tg o">Tükendi</span>';
    var d = document.createElement('div');
    d.className = 'it' + (it.available ? '' : ' out');
    d.innerHTML = '<div class="row"><span class="pr">' + prices + '</span><span class="nm">' + esc(it.name) + '</span>' + tags + '</div>' +
      (it.description ? '<div class="ds">' + esc(it.description) + '</div>' : '');
    return d;
  }
  function catEl(c, cont) {
    var d = document.createElement('div');
    d.className = 'cat serif';
    d.innerHTML = (c.icon && showIcons ? esc(c.icon) + ' ' : '') + esc(c.name) + (cont ? ' <small>(devam)</small>' : '');
    return d;
  }
  function build(mk) { return mk.head ? catEl(mk.c, mk.cont) : itemEl(mk.it); }

  // ---------- sayfalama: sütunları tek tek doldur, dolunca sonraki sütuna / sayfaya geç ----------
  function layout() {
    var n = Math.max(1, Math.min(5, +menu.theme.tvColumns || 3));
    var W = stage.offsetWidth, H = stage.offsetHeight;
    var gap = Math.round(W * 0.04), colW = Math.floor((W - gap * (n - 1)) / n);

    var meas = document.createElement('div');
    meas.id = 'measure'; meas.style.width = colW + 'px';
    stage.appendChild(meas);

    var result = [], page = [], col = [];
    function add(mk) {
      var el = build(mk);
      if (mk.head && !col.length) el.className += ' first';
      meas.appendChild(el); col.push(mk);
    }
    function fits() { return meas.offsetHeight <= H; }
    function removeLast() { meas.removeChild(meas.lastChild); return col.pop(); }
    function nextCol() {
      page.push(col); col = []; meas.innerHTML = '';
      if (page.length >= n) { result.push(page); page = []; }
    }

    var cats = C.visibleCategories(menu);
    for (var ci = 0; ci < cats.length; ci++) {
      var c = cats[ci];
      add({ c: c, head: true, cont: false });
      if (!fits() && col.length > 1) { removeLast(); nextCol(); add({ c: c, head: true, cont: false }); }
      for (var ii = 0; ii < c.items.length; ii++) {
        var mk = { c: c, it: c.items[ii] };
        add(mk);
        if (fits()) continue;
        removeLast();
        var carried = null;
        if (col.length && col[col.length - 1].head) carried = removeLast();
        if (col.length) nextCol();
        add(carried || { c: c, head: true, cont: true });
        add(mk);
      }
    }
    if (col.length && col[col.length - 1].head) col.pop();
    if (col.length) page.push(col);
    if (page.length) result.push(page);
    stage.removeChild(meas);
    return { pages: result, colW: colW, gap: gap };
  }

  function render() {
    var L = layout();
    stage.innerHTML = '';
    pages = [];
    for (var p = 0; p < L.pages.length; p++) {
      var pg = document.createElement('div');
      pg.className = 'page' + (p === 0 ? ' show' : '');
      for (var k = 0; k < L.pages[p].length; k++) {
        var colEl = document.createElement('div');
        colEl.className = 'col';
        colEl.style.left = (k * (L.colW + L.gap)) + 'px';
        colEl.style.width = L.colW + 'px';
        var items = L.pages[p][k];
        for (var x = 0; x < items.length; x++) {
          var el = build(items[x]);
          if (x === 0 && items[x].head) el.className += ' first';
          colEl.appendChild(el);
        }
        pg.appendChild(colEl);
      }
      stage.appendChild(pg);
      pages.push(pg);
    }
    if (!pages.length) stage.innerHTML = '<div class="msg">Menü boş.</div>';
    pageIdx = 0; hideSlide(); dots(); schedule();
  }

  function dots() {
    var h = '';
    if (pages.length > 1) for (var i = 0; i < pages.length; i++) h += '<span' + (i === pageIdx ? ' class="on"' : '') + '></span>';
    $('dots').innerHTML = h;
  }
  // ---------- akış: menü sayfaları sırayla, her turun sonunda 1 tanıtım resmi ----------
  function activeSlides() {
    var out = [], s = menu.tvSlides || [];
    for (var i = 0; i < s.length; i++) if (s[i].active !== false && s[i].image) out.push(s[i]);
    return out;
  }
  // Resimleri önceden yükle; ekran oranına yakınsa ekranı doldur, değilse sığdır (kesilmesin)
  function preload() {
    var s = activeSlides();
    for (var i = 0; i < s.length; i++) (function (src) {
      if (slideInfo[src]) return;
      var im = new Image();
      im.onload = function () { slideInfo[src] = { r: im.width / im.height }; };
      im.src = src;
    })(s[i].image);
  }
  function showPage(i) {
    if (!pages.length) return;
    pages[pageIdx].className = 'page';
    pageIdx = i;
    pages[pageIdx].className = 'page show';
    dots();
  }
  function showSlide(sl) {
    var el = $('slide'), info = slideInfo[sl.image], screenR = (window.innerWidth || 16) / (window.innerHeight || 9);
    el.style.backgroundImage = 'url("' + sl.image.replace(/"/g, '%22') + '")';
    el.className = (info && Math.abs(info.r - screenR) > 0.35) ? 'show contain' : 'show';
  }
  function hideSlide() { var el = $('slide'); el.className = el.className.replace('show', ''); }
  function schedule() {
    clearTimeout(timer);
    var menuSecs = Math.max(4, +menu.theme.tvSeconds || 12);
    var slideSecs = Math.max(3, +menu.theme.tvSlideSeconds || 8);
    preload();
    function next() {
      if (pageIdx < pages.length - 1) { showPage(pageIdx + 1); timer = setTimeout(next, menuSecs * 1000); return; }
      var sl = activeSlides();
      if (sl.length) {
        showSlide(sl[slideIdx % sl.length]); slideIdx++;
        timer = setTimeout(function () {
          showPage(0); hideSlide();
          timer = setTimeout(next, menuSecs * 1000);
        }, slideSecs * 1000);
      } else {
        if (pages.length > 1) showPage(0);
        timer = setTimeout(next, menuSecs * 1000);
      }
    }
    timer = setTimeout(next, menuSecs * 1000);
  }

  function renderChrome() {
    var cafe = menu.cafe;
    document.title = (cafe.name || 'Menü') + ' — TV';
    $('brand').innerHTML = (cafe.logo ? '<img src="' + esc(cafe.logo) + '" alt="">' : '') +
      '<div style="overflow:hidden"><h1 class="serif">' + esc(cafe.name || 'Menü') + '</h1>' + (cafe.slogan ? '<p>' + esc(cafe.slogan) + '</p>' : '') + '</div>';
    var qrBox = $('qr');
    qrBox.innerHTML = '';
    if (param('qr') !== '0' && window.qrcode) {
      try {
        var q = window.qrcode(0, 'M'); q.addData(C.baseUrl(menu)); q.make();
        qrBox.innerHTML = '<div class="code">' + q.createImgTag(4, 8) + '</div><div class="txt"><b>Menüyü telefonunuzda görün</b>Kameranızla okutun</div>';
      } catch (e) { qrBox.innerHTML = ''; }
    }
    var info = '';
    if (cafe.wifiName) info += '<span>Wi-Fi <b>' + esc(cafe.wifiName) + '</b>' + (cafe.wifiPassword ? ' · Şifre <b>' + esc(cafe.wifiPassword) + '</b>' : '') + '</span>';
    if (cafe.instagram) info += '<span>Instagram <b>@' + esc(cafe.instagram.replace(/^@/, '')) + '</b></span>';
    $('info').innerHTML = info;
  }

  // ---------- veri (fetch/Promise olmayan tarayıcılar için XMLHttpRequest) ----------
  function getJSON(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        var data;
        try { data = JSON.parse(x.responseText); } catch (e) { fail(e); return; }
        ok(data);
      } else fail(new Error('HTTP ' + x.status));
    };
    x.send();
  }

  function load() {
    getJSON('menu.json?v=' + new Date().getTime(), function (raw) {
      var j = JSON.stringify(raw);
      if (j === lastJson) return;
      lastJson = j; menu = C.normalize(raw);
      stage.style.fontSize = menu.theme.tvScale + 'rem';
      applyColors(); renderChrome(); render();
      // yazı tipi geç yüklenirse ölçüler değişir; bir kez daha diz
      setTimeout(function () { if (menu) render(); }, 2500);
    }, function () {
      if (!menu) stage.innerHTML = '<div class="msg">Menü yüklenemedi, tekrar deneniyor…</div>';
    });
  }
  load();
  setInterval(load, 60000);                                        // dakikada bir değişiklik kontrolü
  setTimeout(function () { location.reload(); }, 6 * 3600 * 1000); // uzun açık kalan TV için tazele
  var rz;
  window.onresize = function () { clearTimeout(rz); rz = setTimeout(function () { scale(); if (menu) render(); }, 300); };
})();
</script>
</body>
</html>
