<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menü</title>
<meta name="theme-color" content="#f7f3ee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #b5651d;
    --bg: #f7f3ee;
    --surface: #ffffff;
    --text: #2a201a;
    --muted: #7a6a5e;
    --line: #e8dfd5;
    --chip: #efe7de;
    --shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 16px rgba(60,40,20,.06);
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16110e; --surface: #211a15; --text: #f3ebe3; --muted: #b3a294;
      --line: #342a22; --chip: #2c231c; --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16110e; --surface: #211a15; --text: #f3ebe3; --muted: #b3a294;
    --line: #342a22; --chip: #2c231c; --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

  header.hero { padding: 28px 0 18px; text-align: center; }
  .logo { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 12px; box-shadow: var(--shadow); background: var(--surface); }
  .hero h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 7vw, 40px); margin: 0; letter-spacing: -.01em; }
  .hero p { margin: 6px 0 0; color: var(--muted); }
  .table-badge { display: inline-block; margin-top: 12px; padding: 4px 12px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; }

  .bar { position: sticky; top: 0; z-index: 10; background: var(--bg); background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; align-items: center; gap: 8px; padding-top: 10px; padding-bottom: 10px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; scroll-behavior: smooth; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; background: var(--chip); color: var(--text); padding: 8px 14px; border-radius: 999px; font: 500 14px var(--sans); cursor: pointer; white-space: nowrap; }
  .chip.active { background: var(--accent); color: #fff; }
  .icon-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--chip); color: var(--text); display: grid; place-items: center; cursor: pointer; }
  .bar .search { display: none; padding-bottom: 10px; }
  .bar .search.open { display: block; }
  .search input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 16px var(--sans); outline: none; }
  .search input:focus { border-color: var(--accent); }

  main { padding: 8px 0 40px; }
  section.cat { padding-top: 22px; scroll-margin-top: 70px; }
  section.cat h2 { font-family: var(--serif); font-weight: 600; font-size: 24px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .items { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 720px) { .items { grid-template-columns: 1fr 1fr; gap: 12px; } }
  @media (min-width: 1024px) { body { font-size: 17px; } }

  .item { display: flex; gap: 12px; background: var(--surface); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); cursor: pointer; text-align: left; border: 0; color: inherit; font: inherit; width: 100%; align-items: flex-start; }
  .item .body { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; margin: 0; }
  .item .desc { color: var(--muted); font-size: .9em; margin: 3px 0 0; }
  .item .price { margin-top: 8px; font-weight: 600; color: var(--accent); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .item .price small { color: var(--muted); font-weight: 500; margin-right: 4px; }
  .item img { width: 88px; height: 88px; border-radius: 10px; object-fit: cover; flex: none; background: var(--chip); }
  .item.soldout { opacity: .55; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 6px; background: var(--chip); color: var(--accent); margin-left: 6px; vertical-align: 2px; }
  .tag.out { background: #b3261e; color: #fff; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--muted); font-size: 14px; }
  .info { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: 16px; }
  .info div { background: var(--surface); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
  .info b { display: block; color: var(--text); font-weight: 600; margin-bottom: 2px; }
  .info a { color: var(--accent); text-decoration: none; }
  .note { text-align: center; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-radius: 20px 20px 0 0; max-height: 88vh; overflow: auto; transform: translateY(100%); transition: transform .25s ease; padding-bottom: env(safe-area-inset-bottom); }
  .sheet.open { transform: none; }
  .sheet-bg.open { display: block; }
  @media (min-width: 720px) { .sheet { left: 50%; right: auto; width: 520px; bottom: auto; top: 50%; border-radius: 20px; transform: translate(-50%, -40%); opacity: 0; pointer-events: none; transition: .2s; } .sheet.open { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; } }
  .sheet img { width: 100%; max-height: 50vh; object-fit: cover; display: block; }
  .sheet .content { padding: 18px 20px 24px; }
  .sheet h3 { font-family: var(--serif); font-size: 26px; margin: 0 0 6px; }
  .sheet p { color: var(--muted); margin: 0 0 14px; }
  .sheet .rows div { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); font-weight: 600; }
  .sheet .rows div span:last-child { color: var(--accent); }
  .sheet .close { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 20px; cursor: pointer; }
  .loading { text-align: center; padding: 80px 16px; color: var(--muted); }
</style>
</head>
<body>
<div id="app"><div class="loading">Menü yükleniyor…</div></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script src="assets/core.js"></script>
<script>
(function () {
  'use strict';
  var C = window.MenuCore, esc = C.esc;
  var params = new URLSearchParams(location.search);
  var table = params.get('masa');
  var kiosk = params.get('kiosk') === '1';
  if (params.get('tema')) document.documentElement.setAttribute('data-theme', params.get('tema'));
  if (table) try { sessionStorage.setItem('masa', table); } catch (e) {}
  if (!table) try { table = sessionStorage.getItem('masa'); } catch (e) {}

  var menu = null, lastJson = '', app = document.getElementById('app');

  function priceHtml(it) {
    return C.prices(it).map(function (p) {
      return '<span>' + (p.name ? '<small>' + esc(p.name) + '</small>' : '') + esc(C.price(p.price, menu.cafe.currency)) + '</span>';
    }).join('');
  }

  function itemHtml(it, ci, ii) {
    var tags = (it.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
    if (!it.available) tags += '<span class="tag out">Tükendi</span>';
    return '<button class="item' + (it.available ? '' : ' soldout') + '" data-c="' + ci + '" data-i="' + ii + '" data-q="' + esc((it.name + ' ' + it.description + ' ' + it.tags.join(' ')).toLocaleLowerCase('tr')) + '">' +
      '<div class="body"><p class="name">' + esc(it.name) + tags + '</p>' +
      (it.description ? '<p class="desc">' + esc(it.description) + '</p>' : '') +
      '<div class="price">' + priceHtml(it) + '</div></div>' +
      (it.image ? '<img loading="lazy" src="' + esc(it.image) + '" alt="">' : '') +
      '</button>';
  }

  function render() {
    var cafe = menu.cafe, cats = C.visibleCategories(menu);
    document.title = (cafe.name || 'Menü') + ' — Menü';
    C.applyAccent(menu);
    var h = '';
    h += '<header class="hero wrap">' +
      (cafe.logo ? '<img class="logo" src="' + esc(cafe.logo) + '" alt="">' : '') +
      '<h1>' + esc(cafe.name || 'Menü') + '</h1>' +
      (cafe.slogan ? '<p>' + esc(cafe.slogan) + '</p>' : '') +
      (table ? '<span class="table-badge">Masa ' + esc(table) + '</span>' : '') +
      '</header>';
    h += '<div class="bar"><div class="wrap"><nav class="chips" id="chips">' +
      cats.map(function (c) { return '<button class="chip" data-target="c-' + esc(c.id) + '">' + (c.icon ? esc(c.icon) + ' ' : '') + esc(c.name) + '</button>'; }).join('') +
      '</nav><button class="icon-btn" id="searchBtn" aria-label="Ara"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button></div>' +
      '<div class="wrap search" id="search"><input id="q" type="search" placeholder="Menüde ara…" autocomplete="off"></div></div>';
    h += '<main class="wrap" id="list">';
    cats.forEach(function (c) {
      var ci = menu.categories.indexOf(c);
      h += '<section class="cat" id="c-' + esc(c.id) + '"><h2>' + (c.icon ? '<span>' + esc(c.icon) + '</span>' : '') + esc(c.name) + '</h2><div class="items">' +
        c.items.map(function (it, ii) { return itemHtml(it, ci, ii); }).join('') + '</div></section>';
    });
    if (!cats.length) h += '<p class="empty">Menü henüz hazır değil.</p>';
    h += '<p class="empty" id="noResult" hidden>Aramanızla eşleşen ürün yok.</p></main>';

    var info = [];
    if (cafe.wifiName) info.push('<div><b>Wi-Fi</b>' + esc(cafe.wifiName) + (cafe.wifiPassword ? ' · Şifre: <span style="user-select:all">' + esc(cafe.wifiPassword) + '</span>' : '') + '</div>');
    if (cafe.instagram) { var ig = cafe.instagram.replace(/^@/, ''); info.push('<div><b>Instagram</b><a href="https://instagram.com/' + encodeURIComponent(ig) + '" target="_blank" rel="noopener">@' + esc(ig) + '</a></div>'); }
    if (cafe.phone) info.push('<div><b>Telefon</b><a href="tel:' + esc(cafe.phone.replace(/\s/g, '')) + '">' + esc(cafe.phone) + '</a></div>');
    if (cafe.address) info.push('<div><b>Adres</b>' + esc(cafe.address) + '</div>');
    h += '<footer><div class="wrap">' + (info.length ? '<div class="info">' + info.join('') + '</div>' : '') +
      (cafe.note ? '<p class="note">' + esc(cafe.note) + '</p>' : '') + '</div></footer>';

    var y = window.scrollY;
    app.innerHTML = h;
    window.scrollTo(0, y);
    bind();
  }

  function bind() {
    var chips = document.getElementById('chips');
    chips.addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      var s = document.getElementById(b.getAttribute('data-target'));
      if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    document.getElementById('searchBtn').addEventListener('click', function () {
      var s = document.getElementById('search'); s.classList.toggle('open');
      if (s.classList.contains('open')) document.getElementById('q').focus(); else { document.getElementById('q').value = ''; filter(''); }
    });
    document.getElementById('q').addEventListener('input', function (e) { filter(e.target.value); });
    document.getElementById('list').addEventListener('click', function (e) {
      var b = e.target.closest('.item'); if (!b) return;
      openSheet(menu.categories[+b.getAttribute('data-c')].items[+b.getAttribute('data-i')]);
    });
    // Aktif kategoriyi işaretle
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          var btns = chips.querySelectorAll('.chip');
          for (var i = 0; i < btns.length; i++) {
            var on = btns[i].getAttribute('data-target') === en.target.id;
            btns[i].classList.toggle('active', on);
            if (on) chips.scrollTo({ left: btns[i].offsetLeft - 16, behavior: 'smooth' });
          }
        });
      }, { rootMargin: '-80px 0px -70% 0px' });
      document.querySelectorAll('section.cat').forEach(function (s) { io.observe(s); });
    }
  }

  function filter(q) {
    q = q.trim().toLocaleLowerCase('tr');
    var any = false;
    document.querySelectorAll('section.cat').forEach(function (sec) {
      var vis = 0;
      sec.querySelectorAll('.item').forEach(function (it) {
        var ok = !q || it.getAttribute('data-q').indexOf(q) !== -1;
        it.style.display = ok ? '' : 'none'; if (ok) vis++;
      });
      sec.style.display = vis ? '' : 'none'; if (vis) any = true;
    });
    document.getElementById('noResult').hidden = any;
  }

  var sheet = document.getElementById('sheet'), sheetBg = document.getElementById('sheetBg');
  function openSheet(it) {
    var rows = C.prices(it).map(function (p) { return '<div><span>' + esc(p.name || 'Fiyat') + '</span><span>' + esc(C.price(p.price, menu.cafe.currency)) + '</span></div>'; }).join('');
    sheet.innerHTML = '<button class="close" aria-label="Kapat">×</button>' +
      (it.image ? '<img src="' + esc(it.image) + '" alt="">' : '<div style="height:44px"></div>') +
      '<div class="content"><h3>' + esc(it.name) + (it.available ? '' : ' <span class="tag out">Tükendi</span>') + '</h3>' +
      (it.description ? '<p>' + esc(it.description) + '</p>' : '') +
      (it.tags.length ? '<p>' + it.tags.map(function (t) { return '<span class="tag" style="margin:0 6px 0 0">' + esc(t) + '</span>'; }).join('') + '</p>' : '') +
      '<div class="rows">' + rows + '</div></div>';
    sheet.classList.add('open'); sheetBg.classList.add('open');
    sheet.querySelector('.close').onclick = closeSheet;
  }
  function closeSheet() { sheet.classList.remove('open'); sheetBg.classList.remove('open'); }
  sheetBg.onclick = closeSheet;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  function load(first) {
    return C.load().then(function (m) {
      var j = JSON.stringify(m);
      if (j === lastJson) return;
      lastJson = j; menu = m; render();
    }).catch(function (err) {
      if (first) app.innerHTML = '<div class="loading">Menü şu an yüklenemedi. Lütfen sayfayı yenileyin.<br><small>' + esc(err.message) + '</small></div>';
    });
  }
  load(true);

  // Tablet / kiosk modu: hareketsiz kalınca başa dön, menüyü düzenli yenile
  if (kiosk) {
    var idle;
    var reset = function () {
      clearTimeout(idle);
      idle = setTimeout(function () {
        closeSheet();
        var q = document.getElementById('q'); if (q && q.value) { q.value = ''; filter(''); document.getElementById('search').classList.remove('open'); }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 90000);
    };
    ['touchstart', 'click', 'scroll', 'keydown'].forEach(function (ev) { window.addEventListener(ev, reset, { passive: true }); });
    reset();
    setInterval(function () { load(false); }, 120000);
  } else {
    document.addEventListener('visibilitychange', function () { if (!document.hidden) load(false); });
  }
})();
</script>
</body>
</html>
